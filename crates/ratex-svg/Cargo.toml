[package]
name = "ratex-svg"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "SVG export for RaTeX DisplayList (self-contained vector output)"

[features]
default = []
## `render-svg` binary: parse + layout from stdin.
cli = ["dep:ratex-layout", "dep:ratex-parser"]

[dependencies]
ratex-types = { workspace = true }
ab_glyph = { version = "0.2" }
ratex-font = { workspace = true }
ratex-font-loader = { workspace = true, features = ["embed-fonts"] }
ratex-layout = { workspace = true, optional = true }
ratex-parser = { workspace = true, optional = true }
ratex-katex-fonts = { workspace = true }
ratex-unicode-font = { workspace = true }

[[bin]]
name = "render-svg"
path = "src/bin/render_svg.rs"
required-features = ["cli"]

[dev-dependencies]
ratex-layout = { workspace = true }
ratex-parser = { workspace = true }
png = "0.17"
resvg = { version = "0.47", default-features = false }

[[test]]
name = "golden_svg"
path = "tests/golden_svg.rs"
